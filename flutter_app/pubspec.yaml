name: flutter_application_ar
description: "ARchitect AI — ARCore Edition"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image_picker: ^1.0.4
  webview_flutter: ^4.4.2
  webview_flutter_android: ^4.0.0
  http: ^1.1.0
  google_fonts: ^6.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0
  cupertino_icons: ^1.0.8
  vector_math: ^2.1.4
  path_provider: ^2.1.2
  # Google ARCore via local patched plugin
  ar_flutter_plugin:
    path: local_packages/ar_flutter_plugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  permission_handler: ^11.3.1
  permission_handler_android: ^12.0.13
  permission_handler_apple: ^9.4.5
  permission_handler_platform_interface: ^4.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/viewer.html
    - assets/thumbnail.html
    - assets/buildings/
    - assets/ar_viewer.html
