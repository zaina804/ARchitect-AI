<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { margin:0; padding:0; }
html, body { width:512px; height:512px; overflow:hidden; background:transparent; }
#renderCanvas { width:512px; height:512px; background:transparent; display:block; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
(function () {
  var engine, scene;

  function init() {
    var canvas = document.getElementById('renderCanvas');
    engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

    // Isometric-style camera
    var camera = new BABYLON.ArcRotateCamera('cam', -Math.PI / 4, Math.PI / 3.5, 14, BABYLON.Vector3.Zero(), scene);
    camera.lowerRadiusLimit = 4;
    camera.upperRadiusLimit = 40;

    // Lighting
    var hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 1.0;
    var dir = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-1, -2, -1), scene);
    dir.intensity = 0.6;

    engine.runRenderLoop(function () { scene.render(); });
    window.addEventListener('resize', function () { engine.resize(); });
  }

  window.loadGlb = function (url) {
    if (!scene) {
      init();
    }
    // Remove previous meshes (except lights/cameras)
    scene.meshes.slice().forEach(function (m) { m.dispose(); });

    BABYLON.SceneLoader.ImportMeshAsync('', '', url, scene).then(function (result) {
      // Auto-fit camera to bounding box
      var allMeshes = result.meshes;
      if (allMeshes.length > 0) {
        var min = new BABYLON.Vector3(Infinity, Infinity, Infinity);
        var max = new BABYLON.Vector3(-Infinity, -Infinity, -Infinity);
        allMeshes.forEach(function (m) {
          var info = m.getHierarchyBoundingVectors();
          min = BABYLON.Vector3.Minimize(min, info.min);
          max = BABYLON.Vector3.Maximize(max, info.max);
        });
        var center = BABYLON.Vector3.Center(min, max);
        var size = max.subtract(min).length();
        scene.activeCamera.target = center;
        scene.activeCamera.radius = size * 1.4;
      }

      // Wait 2 frames then capture
      scene.executeWhenReady(function () {
        scene.render();
        setTimeout(function () {
          scene.render();
          var canvas = document.getElementById('renderCanvas');
          var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          var b64 = dataUrl.split(',')[1];
          if (window.ThumbnailChannel) {
            window.ThumbnailChannel.postMessage(b64);
          }
        }, 800);
      });
    }).catch(function (err) {
      if (window.ThumbnailChannel) {
        window.ThumbnailChannel.postMessage('ERROR:' + err.message);
      }
    });
  };

  // Init engine immediately so it's ready when Flutter calls loadGlb
  init();
})();
</script>
</body>
</html>
