// ─────────────────────────────────────────────────────────────────────────────
//  PER-FLOOR MESH VISIBILITY — save/restore building mesh states for slicing
// ─────────────────────────────────────────────────────────────────────────────
function saveAndApplyFloorVisibility() {
    _meshStates.clear();
    _matStates.clear();
    const floorBottom = currentFloor * floorH;
    const floorCeil   = floorBottom + floorH;

    scene.meshes.forEach(m => {
        // Skip non-building meshes
        if (!m.material || !m.getBoundingInfo) return;
        const n = m.name || '';
        if (n === 'zonePickFloor' || n === 'gnd' || n === 'interiorFloor' ||
            n.startsWith('ztile') || n.startsWith('furpiv') || n.startsWith('selRing') ||
            (m.metadata && (m.metadata.isFurPivot || m.metadata.isSourceFur))) return;

        // Save mesh visibility (per mesh — each has its own isVisible flag)
        _meshStates.set(m, { isVisible: m.isVisible });

        // Save material state ONCE per material object (shared materials were the
        // bug: second mesh would save the already-modified alpha, so restore was wrong)
        if (!_matStates.has(m.material.uniqueId)) {
            _matStates.set(m.material.uniqueId, {
                mat:       m.material,
                alpha:     m.material.alpha,
                transMode: m.material.transparencyMode
            });
        }

        try {
            m.computeWorldMatrix(true);
            const bb      = m.getBoundingInfo().boundingBox;
            const meshBot = bb.minimumWorld.y;

            if (meshBot > floorCeil + 0.35) {
                // Completely above this floor's ceiling → hide
                m.isVisible = false;
            } else if (meshBot > floorCeil - 1.0 && meshBot <= floorCeil + 0.35) {
                // Ceiling band of current floor → make transparent so we see inside
                m.isVisible = true;
                if (m.material.alpha > 0.15) {
                    m.material.alpha = 0.07;
                    if (m.material.transparencyMode !== undefined)
                        m.material.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
                }
            }
        } catch(e) {}
    });
}

function restoreAllMeshVisibility() {
    // Restore mesh visibility per mesh
    _meshStates.forEach((st, m) => {
        try { m.isVisible = st.isVisible; } catch(e) {}
    });
    // Restore material alpha/transparency once per material (avoids shared-material corruption)
    _matStates.forEach(st => {
        try {
            if (st.mat) {
                st.mat.alpha = st.alpha;
                if (st.mat.transparencyMode !== undefined)
                    st.mat.transparencyMode = st.transMode;
            }
        } catch(e) {}
    });
    _meshStates.clear();
    _matStates.clear();
}

// ─────────────────────────────────────────────────────────────────────────────
//  PER-FLOOR ZONE GRID MANAGEMENT
// ─────────────────────────────────────────────────────────────────────────────
function saveCurrentFloorZones() {
    if (zoneGrid.length) {
        zoneGrid.forEach(t => { try { t.isVisible = false; } catch(e) {} });
        allZonesByFloor[currentFloor] = zoneGrid.slice();
    }
    zoneGrid = [];
}

function loadFloorZones(floorIdx) {
    const saved = allZonesByFloor[floorIdx];
    const y = buildingFloorOffset + floorIdx * floorH + 0.04;
    if (saved && saved.length) {
        zoneGrid = saved;
        zoneGrid.forEach(t => { t.isVisible = true; t.position.y = y; });
    } else {
        createZoneGrid();
    }
}

// ─────────────────────────────────────────────────────────────────────────────
//  PER-FLOOR FURNITURE MANAGEMENT
// ─────────────────────────────────────────────────────────────────────────────
function saveCurrentFloorFurniture() {
    if (furnitureList.length) {
        furnitureList.forEach(p => {
            try { p.getChildMeshes(false).forEach(m => m.isVisible = false); } catch(e) {}
        });
        allFurByFloor[currentFloor] = furnitureList.slice();
    }
    furnitureList = [];
}

function loadFloorFurniture(floorIdx) {
    const saved = allFurByFloor[floorIdx];
    if (saved && saved.length) {
        furnitureList = saved;
        furnitureList.forEach(p => {
            try { p.getChildMeshes(false).forEach(m => m.isVisible = true); } catch(e) {}
        });
    } else {
        furnitureList = [];
    }
}

// Show ALL floors' furniture (used when entering interior view)
function showAllFloorFurniture() {
    Object.values(allFurByFloor).forEach(list =>
        list.forEach(p => { try { p.getChildMeshes(false).forEach(m => m.isVisible = true); } catch(e) {} }));
    furnitureList.forEach(p => { try { p.getChildMeshes(false).forEach(m => m.isVisible = true); } catch(e) {} });
}

// ─────────────────────────────────────────────────────────────────────────────
//  FLOOR NAVIGATION
// ─────────────────────────────────────────────────────────────────────────────
function updateFloorUI() {
    const lbl    = document.getElementById('floor-label');
    const btnUp  = document.getElementById('btn-floor-up');
    const btnDn  = document.getElementById('btn-floor-down');
    if (lbl)   lbl.textContent = 'Floor ' + (currentFloor + 1) + ' / ' + numFloors;
    if (btnDn) btnDn.disabled  = (currentFloor === 0);
    if (btnUp) btnUp.disabled  = (currentFloor >= numFloors - 1);
}

function changeFloor(delta) {
    if (!isFloorPlan) return;
    const next = currentFloor + delta;
    if (next < 0 || next >= numFloors) return;

    deselectFurniture();
    hideZonePopup();
    saveCurrentFloorZones();
    saveCurrentFloorFurniture();

    currentFloor = next;

    // Re-slice building for new floor
    restoreAllMeshVisibility();
    saveAndApplyFloorVisibility();

    // Move zone pick floor to this floor's level
    if (zonePickFloor) zonePickFloor.position.y = buildingFloorOffset + currentFloor * floorH + 0.01;

    // Load (or create) zones and furniture for new floor
    loadFloorZones(currentFloor);
    loadFloorFurniture(currentFloor);

    // Pan camera to new floor height
    camera.target = new BABYLON.Vector3(0, currentFloor * floorH + floorH * 0.5, 0);

    updateFloorUI();
    markDirty();
    showHint('Floor ' + (currentFloor + 1) + ' of ' + numFloors + ' · tap a zone to assign a room');
}

// ─────────────────────────────────────────────────────────────────────────────
//  PRIMITIVE FURNITURE FALLBACK
//  Called by _autoPlace / addFurniture when a mesh key isn't in Augh.glb
// ─────────────────────────────────────────────────────────────────────────────
function _makePrimitiveFurniture(type, wx, wy, wz) {
    const s = _primSizes[type] || { w:0.8, h:0.9, d:0.8, r:0.65, g:0.55, b:0.45 };

    const furPivot = new BABYLON.TransformNode('furpiv_' + Date.now(), scene);
    furPivot.metadata = { isFurPivot: true };

    const box = BABYLON.MeshBuilder.CreateBox(type + '_prim_' + Date.now(),
        { width: s.w, height: s.h, depth: s.d }, scene);
    const mat = new BABYLON.PBRMaterial(type + '_pmat_' + Date.now(), scene);
    mat.albedoColor    = new BABYLON.Color3(s.r, s.g, s.b);
    mat.metallic       = 0.05;
    mat.roughness      = 0.80;
    mat.backFaceCulling = false;
    box.material   = mat;
    box.position.y = s.h / 2;   // sit base on floor
    box.parent     = furPivot;
    box.isPickable = true;
    box.receiveShadows = true;
    box.metadata   = { furPivot };
    try { shadows.addShadowCaster(box, true); } catch(e) {}

    furPivot.position.set(wx, wy, wz);
    return furPivot;
}

// ─────────────────────────────────────────────────────────────────────────────
//  ZONE GRID CREATION
// ─────────────────────────────────────────────────────────────────────────────
function createZoneGrid() {
    destroyZoneGrid();
    const s  = currentBSize;
    // Place tiles ABOVE the floor slab surface (buildingFloorOffset = top of slab)
    const y  = buildingFloorOffset + currentFloor * floorH + 0.04;
    const n  = s > 12 ? 3 : 2;
    const cw = s / n, cd = s / n;
    for (let ix = 0; ix < n; ix++) {
        for (let iz = 0; iz < n; iz++) {
            const cx = -s/2 + cw*(ix+0.5);
            const cz = -s/2 + cd*(iz+0.5);
            const tile = BABYLON.MeshBuilder.CreateGround(
                'ztile_'+ix+'_'+iz, { width: cw*0.90, height: cd*0.90 }, scene);
            tile.position.set(cx, y, cz);
            tile.isPickable = true;
            const mat = new BABYLON.PBRMaterial('zmat_'+ix+'_'+iz+'_'+currentFloor, scene);
            mat.albedoColor = new BABYLON.Color3(0.35, 0.35, 0.35);
            mat.metallic = 0; mat.roughness = 1;
            mat.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
            mat.alpha = 0.30;
            tile.material = mat;
            tile.metadata = { isZoneTile:true, roomType:null, cx, cz, w:cw, d:cd };
            zoneGrid.push(tile);
        }
    }
}

function destroyZoneGrid() {
    zoneGrid.forEach(t => { try { t.dispose(); } catch(e) {} });
    zoneGrid = [];
    hideZonePopup();
}

function showZonePopup(tile) {
    activeZoneMesh = tile;
    document.getElementById('zone-popup').classList.add('show');
}

function hideZonePopup() {
    document.getElementById('zone-popup').classList.remove('show');
    activeZoneMesh = null;
}

function assignRoom(roomType) {
    if (!activeZoneMesh) return;
    const tile = activeZoneMesh;
    hideZonePopup();

    tile.metadata.roomType = roomType;
    const mat = tile.material;
    if (!roomType || !_roomColors[roomType]) {
        mat.albedoColor = new BABYLON.Color3(0.35, 0.35, 0.35);
        mat.alpha = 0.30;
        // Clear room; reset furniture bar to show all
        if (isInterior)
            document.querySelectorAll('#interior-bar .fbtn').forEach(b => b.style.display = '');
        markDirty();
        return;
    }

    mat.albedoColor = _roomColors[roomType];
    mat.alpha = 0.45;
    markDirty();  // immediately repaint so color shows without waiting for furniture load

    // Filter furniture bar to room-relevant items (only visible in interior mode)
    if (isInterior) {
        const allowed = _roomFurItems[roomType] || [];
        document.querySelectorAll('#interior-bar .fbtn').forEach(btn => {
            // Match class fur-<type> added in HTML
            const furClass = Array.from(btn.classList).find(c => c.startsWith('fur-'));
            if (furClass) {
                const furType = furClass.replace('fur-', '');
                btn.style.display = allowed.includes(furType) ? '' : 'none';
            }
        });
        showHint((_roomLabels[roomType] || roomType) + ' · tap a piece to add');
    } else {
        showHint((_roomLabels[roomType] || roomType) + ' assigned · enter Interior to add/adjust furniture');
    }

    // Auto-place default furniture for this room type.
    // If Augh.glb isn't loaded yet, wait for it then place.
    const doPlace = () => {
        const { cx, cz, w, d } = tile.metadata;
        (_roomPresets[roomType] || []).forEach(p => _autoPlace(p.type, cx + p.rx*w, cz + p.rz*d));
        markDirty();
    };
    if (furGlbLoaded) {
        doPlace();
    } else {
        loadFurnitureGlb(doPlace);
    }
}

function _autoPlace(type, wx, wz) {
    const wy  = buildingFloorOffset + currentFloor * floorH;   // floor Y for current floor
    const pat = (_furMap[type] || type).toLowerCase();
    const matches = furSources.filter(m => m.name.toLowerCase().includes(pat));

    if (!matches.length) {
        // Primitive fallback — furniture GLB mesh not found in Augh.glb
        const piv = _makePrimitiveFurniture(type, wx, wy, wz);
        furnitureList.push(piv);
        return;
    }

    let mn = new BABYLON.Vector3(1e9, 1e9, 1e9);
    let mx = new BABYLON.Vector3(-1e9,-1e9,-1e9);
    matches.forEach(m => {
        m.computeWorldMatrix(true);  // force fresh world-space bounding box
        const bb = m.getBoundingInfo().boundingBox;
        mn = BABYLON.Vector3.Minimize(mn, bb.minimumWorld);
        mx = BABYLON.Vector3.Maximize(mx, bb.maximumWorld);
    });
    const srcCx = (mn.x+mx.x)/2, srcCy = mn.y, srcCz = (mn.z+mx.z)/2;

    const furPivot = new BABYLON.TransformNode('furpiv_'+Date.now(), scene);
    furPivot.metadata = { isFurPivot: true };

    matches.forEach(m => {
        const cl = m.clone(m.name+'_cl'+Date.now(), null);
        if (!cl) return;
        const wp = m.getAbsolutePosition();
        cl.position.set(wp.x-srcCx, wp.y-srcCy, wp.z-srcCz);
        if (m.rotationQuaternion) cl.rotationQuaternion = m.rotationQuaternion.clone();
        else cl.rotation.copyFrom(m.rotation);
        cl.isVisible = true; cl.isPickable = true;
        cl.parent = furPivot;
        cl.metadata = { ...(cl.metadata||{}), furPivot };
        cl.receiveShadows = true;
        try { shadows.addShadowCaster(cl, true); } catch(e) {}
    });
    furPivot.getChildMeshes(false).forEach(cm => {
        cm.metadata = { ...(cm.metadata||{}), furPivot };
        cm.isPickable = true;
    });

    furPivot.position.set(wx, wy, wz);
    // Y-correction: snap base exactly to floor level (both upward and downward)
    furPivot.computeWorldMatrix(true);
    furPivot.getChildMeshes(false).forEach(cm => cm.computeWorldMatrix(true));
    let _minYb = Infinity;
    furPivot.getChildMeshes(false).forEach(cm => {
        try { const b = cm.getBoundingInfo().boundingBox.minimumWorld.y; if (b < _minYb) _minYb = b; } catch(_) {}
    });
    if (_minYb !== Infinity && Math.abs(_minYb - wy) > 0.05)
        furPivot.position.y += (wy - _minYb);
    furnitureList.push(furPivot);
}

// ─────────────────────────────────────────────────────────────────────────────
//  ZONE PLACEMENT (floor plan mode)
// ─────────────────────────────────────────────────────────────────────────────
function startZonePlacement() {
    if (!isFloorPlan) return;
    isPlacingZone = !isPlacingZone;
    const btn = document.getElementById('btn-add-zone');
    if (isPlacingZone) {
        if (btn) btn.style.background = 'rgba(76,175,80,0.35)';
        showHint('Tap anywhere on the floor to place a room zone');
    } else {
        if (btn) btn.style.background = '';
    }
}

function placeZoneAt(wx, wz) {
    isPlacingZone = false;
    const btn = document.getElementById('btn-add-zone');
    if (btn) btn.style.background = '';

    const zs = Math.max(2.5, currentBSize / 3);
    const tile = BABYLON.MeshBuilder.CreateGround('ztile_' + Date.now(),
        { width: zs, height: zs }, scene);
    tile.position.set(wx, 0.04, wz);
    tile.isPickable = true;
    const mat = new BABYLON.PBRMaterial('zmat_' + Date.now(), scene);
    mat.albedoColor = new BABYLON.Color3(0.35, 0.35, 0.35);
    mat.metallic = 0; mat.roughness = 1;
    mat.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
    mat.alpha = 0.45;
    tile.material = mat;
    tile.metadata = { isZoneTile:true, roomType:null, cx:wx, cz:wz, w:zs, d:zs };
    zoneGrid.push(tile);
    showZonePopup(tile);
}

// ─────────────────────────────────────────────────────────────────────────────
//  FLOOR PLAN ↔ INTERIOR TRANSITIONS
// ─────────────────────────────────────────────────────────────────────────────
function interiorExit() {
    if (interiorFromFloorPlan) returnToFloorPlan();
    else exitInterior();
}

function enterInteriorFromFloorPlan() {
    if (!isFloorPlan || isInterior) return;
    isFloorPlan = false;
    isInterior  = true;
    interiorFromFloorPlan = true;
    isPlacingZone = false;

    savedCamFloorPlan = { alpha:camera.alpha, beta:camera.beta, radius:camera.radius,
                          target:camera.target.clone(), fov:camera.fov };

    // Restore all building mesh visibility before entering eye-level view
    restoreAllMeshVisibility();

    if (zonePickFloor) { zonePickFloor.dispose(); zonePickFloor = null; }

    // Hide current floor's zone tiles (they stay in scene, just invisible)
    zoneGrid.forEach(t => { try { t.isVisible = false; } catch(e) {} });

    // Show furniture for ALL floors so user can see everything from inside
    showAllFloorFurniture();

    if (bgPhotoLayer) bgPhotoLayer.isEnabled = false;
    camera.viewport = new BABYLON.Viewport(0, 0, 1, 1);

    // Eye-level camera positioned at the current floor
    const camTargetY = currentFloor * floorH + floorH * 0.42;
    camera.lowerBetaLimit   = 0.05;
    camera.upperBetaLimit   = Math.PI / 2;
    camera.lowerRadiusLimit = 0.3;
    camera.upperRadiusLimit = currentBSize * 0.85;
    camera.fov    = 1.15;
    camera.radius = currentBSize * 0.32;
    camera.beta   = Math.PI * 0.42;
    camera.target = new BABYLON.Vector3(0, camTargetY, 0);
    camera.attachControl(canvas, true);

    scene.clearColor = new BABYLON.Color4(0.80, 0.77, 0.70, 1);

    // Ceiling light at the top of the current floor
    const lightY = currentFloor * floorH + floorH * 0.90;
    interiorLight = new BABYLON.PointLight('intCeil', new BABYLON.Vector3(0, lightY, 0), scene);
    interiorLight.diffuse   = new BABYLON.Color3(1, 0.92, 0.76);
    interiorLight.intensity = 4.5;
    interiorLight.range     = currentBSize * 4;

    // Drag-floor at current floor's surface
    interiorFloor = BABYLON.MeshBuilder.CreateGround('interiorFloor',
        { width: currentBSize * 4, height: currentBSize * 4 }, scene);
    interiorFloor.isPickable = true;
    interiorFloor.isVisible  = false;
    interiorFloor.position.y = buildingFloorOffset + currentFloor * floorH + 0.02;

    try { hlLayer = new BABYLON.HighlightLayer('hl', scene, { mainTextureRatio: 0.5 }); }
    catch(e) { hlLayer = null; }

    document.getElementById('fp-bar').style.display = 'none';
    const exitBtn = document.getElementById('btn-interior-exit');
    if (exitBtn) exitBtn.textContent = '← Floor Plan';

    // Show only this floor's room-relevant furniture buttons (or all if no zone selected)
    loadFurnitureGlb(() => {
        if (!isInterior) return;
        document.querySelectorAll('#interior-bar .fbtn').forEach(b => b.style.display = '');
        document.getElementById('interior-bar').style.display = 'flex';
        showHint('Drag furniture · go back to floor plan to add more rooms');
    });
}

function returnToFloorPlan() {
    if (!isInterior || !interiorFromFloorPlan) return;
    isInterior = false;
    isFloorPlan = true;
    interiorFromFloorPlan = false;
    markDirty();

    deselectFurniture();
    if (hlLayer)       { hlLayer.dispose();      hlLayer = null; }
    if (interiorFloor) { interiorFloor.dispose(); interiorFloor = null; }
    if (interiorLight) { interiorLight.dispose(); interiorLight = null; }

    // Re-hide all other floors' furniture, show only current floor's
    Object.entries(allFurByFloor).forEach(([fi, list]) => {
        if (parseInt(fi) !== currentFloor)
            list.forEach(p => { try { p.getChildMeshes(false).forEach(m => m.isVisible = false); } catch(e) {} });
    });
    // Restore current floor furnitureList
    furnitureList = allFurByFloor[currentFloor] || [];
    furnitureList.forEach(p => { try { p.getChildMeshes(false).forEach(m => m.isVisible = true); } catch(e) {} });

    // Re-apply floor slicing
    restoreAllMeshVisibility();
    saveAndApplyFloorVisibility();

    // Re-create zone pick floor and restore zone grid for current floor
    if (zonePickFloor) zonePickFloor.dispose();
    zonePickFloor = BABYLON.MeshBuilder.CreateGround('zonePickFloor',
        { width: currentBSize * 3, height: currentBSize * 3 }, scene);
    zonePickFloor.isPickable = true;
    zonePickFloor.isVisible  = false;
    zonePickFloor.position.y = buildingFloorOffset + currentFloor * floorH + 0.01;

    loadFloorZones(currentFloor);

    scene.clearColor = new BABYLON.Color4(0.07, 0.10, 0.07, 1);

    // Full-screen viewport for floor plan (initial load used land-clipped sub-region)
    camera.viewport = new BABYLON.Viewport(0, 0, 1, 1);

    if (savedCamFloorPlan) {
        camera.fov = savedCamFloorPlan.fov; camera.alpha = savedCamFloorPlan.alpha;
        camera.beta = savedCamFloorPlan.beta; camera.radius = savedCamFloorPlan.radius;
        camera.target = savedCamFloorPlan.target;
    }
    camera.lowerBetaLimit   = 0;
    camera.upperBetaLimit   = 0.15;
    camera.lowerRadiusLimit = currentBSize * 0.8;
    camera.upperRadiusLimit = currentBSize * 5;

    const exitBtn = document.getElementById('btn-interior-exit');
    if (exitBtn) exitBtn.textContent = '← Exit';

    document.getElementById('interior-bar').style.display = 'none';
    document.getElementById('fp-bar').style.display       = 'flex';
    updateFloorUI();
    showHint('Floor plan · tap a zone to change rooms · navigate floors with ↑↓');
}

function enterInterior() {
    if (!pivot) { showHint('Building still loading, please wait…'); return; }
    if (isInterior)  { exitInterior();  return; }
    if (isFloorPlan) { exitFloorPlan(); return; }
    isIn360 = false;   // allow entry even after 360° mode
    _stop360Spin();
    scene.unfreezeActiveMeshes();
    markDirty();
    isInterior = true;
    interiorFromFloorPlan = false;

    savedCam = { alpha:camera.alpha, beta:camera.beta, radius:camera.radius,
                 target:camera.target.clone(), fov:camera.fov };

    try {
    if (bgPhotoLayer) bgPhotoLayer.isEnabled = false;
    document.getElementById('poly-svg').style.opacity = '0';

    camera.viewport = new BABYLON.Viewport(0, 0, 1, 1);

    // Warm interior daylight background
    scene.clearColor = new BABYLON.Color4(0.80, 0.77, 0.70, 1);

    // Camera inside building at eye level
    camera.lowerRadiusLimit = 0.4;
    camera.upperRadiusLimit = currentBSize * 0.85;
    camera.fov    = 1.15;
    camera.radius = currentBSize * 0.32;
    camera.beta   = Math.PI * 0.42;
    camera.target = new BABYLON.Vector3(0, currentBHeight * 0.38, 0);
    camera.attachControl(canvas, true);

    // Warm ceiling light for interior feel
    interiorLight = new BABYLON.PointLight('intCeil',
        new BABYLON.Vector3(0, currentBHeight * 0.88, 0), scene);
    interiorLight.diffuse    = new BABYLON.Color3(1, 0.92, 0.76);
    interiorLight.intensity  = 4.5;
    interiorLight.range      = currentBSize * 4;

    // Invisible floor plane — furniture drags onto this (at current floor level)
    interiorFloor = BABYLON.MeshBuilder.CreateGround('interiorFloor',
        { width: currentBSize * 4, height: currentBSize * 4 }, scene);
    interiorFloor.isPickable = true;
    interiorFloor.isVisible  = false;
    interiorFloor.position.y = buildingFloorOffset + currentFloor * floorH + 0.02;

    // Highlight layer for selection glow
    try {
        hlLayer = new BABYLON.HighlightLayer('hl', scene, { mainTextureRatio: 0.5 });
    } catch(e) { hlLayer = null; }

    document.getElementById('bottom-bar').style.display = 'none';
    showHint('Loading furniture pack…');
    loadFurnitureGlb(() => {
        if (!isInterior) return;
        document.querySelectorAll('#interior-bar .fbtn').forEach(b => b.style.display = '');
        document.getElementById('interior-bar').style.display = 'flex';
        showHint('Tap a piece to add · drag to move · ↻ rotate');
    });
    } catch(e) {
        isInterior = false;
        showHint('Interior error: ' + e.message);
        console.error('enterInterior error', e);
    }
}

function exitInterior() {
    if (!isInterior) return;
    isInterior = false;
    markDirty();

    destroyZoneGrid();
    deselectFurniture();
    document.querySelectorAll('#interior-bar .fbtn').forEach(b => b.style.display = '');

    if (hlLayer)       { hlLayer.dispose();       hlLayer = null; }
    if (interiorFloor) { interiorFloor.dispose();  interiorFloor = null; }
    if (interiorLight) { interiorLight.dispose();  interiorLight = null; }

    camera.lowerRadiusLimit = null;
    camera.detachControl();

    document.getElementById('interior-bar').style.display = 'none';
    document.getElementById('bottom-bar').style.display   = 'flex';

    // Jump directly into 360 interactive mode — no static-view detour
    start360();
}

// ═══════════════════════════════════════════════════════════════════════════
//  FURNITURE GLB LOADER  — loads Augh.glb from the server's interior pack
// ═══════════════════════════════════════════════════════════════════════════

// Map type keys → partial mesh name to search inside Augh.glb.
// If the name isn't found in Augh.glb, a primitive box is used as fallback.
const _furMap = {
    sofa1:    'couch01',
    sofa2:    'couch02',
    chair1:   'chair01',
    chair2:   'chair03',
    desk:     'desk01',
    shelf:    'shelf01',
    cabinet:  'cabinetdrawer01',
    lamp:     'lamp_stool',
    fridge:   'refrigerator',
    sink:     'sinkkitchen',
    // items below fall back to primitives if not in Augh.glb
    bed:      'bed',
    toilet:   'toilet',
    bathtub:  'bathtub',
    wardrobe: 'wardrobe',
    tv:       'television',
};

// Primitive fallback dimensions + colors when mesh isn't in Augh.glb
const _primSizes = {
    bed:      { w:1.65, h:0.55, d:2.10, r:0.60, g:0.50, b:0.88 },
    toilet:   { w:0.45, h:0.42, d:0.72, r:0.88, g:0.88, b:0.88 },
    bathtub:  { w:0.80, h:0.45, d:1.65, r:0.80, g:0.88, b:0.95 },
    wardrobe: { w:1.20, h:2.00, d:0.55, r:0.60, g:0.48, b:0.38 },
    tv:       { w:1.40, h:0.80, d:0.08, r:0.14, g:0.14, b:0.14 },
    sofa1:    { w:2.00, h:0.85, d:0.85, r:0.35, g:0.50, b:0.75 },
    sofa2:    { w:1.50, h:0.85, d:0.85, r:0.40, g:0.55, b:0.78 },
    chair1:   { w:0.65, h:0.90, d:0.65, r:0.30, g:0.45, b:0.72 },
    chair2:   { w:0.65, h:0.90, d:0.65, r:0.45, g:0.60, b:0.78 },
    desk:     { w:1.40, h:0.75, d:0.70, r:0.58, g:0.45, b:0.32 },
    shelf:    { w:0.90, h:1.80, d:0.35, r:0.55, g:0.42, b:0.30 },
    cabinet:  { w:0.90, h:1.10, d:0.45, r:0.55, g:0.42, b:0.30 },
    lamp:     { w:0.22, h:1.50, d:0.22, r:0.95, g:0.90, b:0.70 },
    fridge:   { w:0.70, h:1.80, d:0.70, r:0.88, g:0.88, b:0.90 },
    sink:     { w:0.60, h:0.85, d:0.50, r:0.88, g:0.88, b:0.90 },
};

let _furGlbCallbacks = [];   // queue callbacks while loading
function loadFurnitureGlb(onDone) {
    if (furGlbLoaded)  { if (onDone) onDone(); return; }
    if (onDone) _furGlbCallbacks.push(onDone);
    if (furGlbLoading) return;   // already in progress — callback is queued
    furGlbLoading = true;

    // Textures are at ../textures/ relative to Augh.glb, which resolves correctly
    // because rootUrl = ".../models/interior/source/" and textures = ".../models/interior/textures/"
    const rootUrl = serverBase + '/models/interior/source/';
    BABYLON.SceneLoader.ImportMesh('', rootUrl, 'Augh.glb', scene,
        (meshes) => {
            furSources = [];
            meshes.forEach(m => {
                if (!m.name || m.name === '__root__') return;
                m.computeWorldMatrix(true);
                m.isVisible  = false;
                m.isPickable = false;
                m.metadata   = { ...(m.metadata || {}), isSourceFur: true };
                furSources.push(m);
            });
            furGlbLoaded  = true;
            furGlbLoading = false;
            console.log('Furniture pack loaded — meshes:', furSources.map(m => m.name));
            const cbs = _furGlbCallbacks.splice(0);
            cbs.forEach(cb => { try { cb(); } catch(e) {} });
        },
        null,
        (_sc, msg) => {
            furGlbLoading = false;
            showHint('⚠ Furniture pack not found — primitives used as fallback');
            console.error('Augh.glb load error:', msg);
            // Fire callbacks anyway — primitive fallback will handle missing meshes
            const cbs = _furGlbCallbacks.splice(0);
            cbs.forEach(cb => { try { cb(); } catch(e) {} });
        },
        '.glb'
    );
}

function addFurniture(type) {
    if (!isInterior) return;
    const floorY = buildingFloorOffset + currentFloor * floorH;

    const pat = (_furMap[type] || type).toLowerCase();
    const matches = furGlbLoaded
        ? furSources.filter(m => m.name.toLowerCase().includes(pat))
        : [];

    if (!matches.length) {
        // Primitive fallback — either GLB not loaded or mesh not found
        const piv = _makePrimitiveFurniture(type, 0, floorY, 0);
        furnitureList.push(piv);
        selectFurniture(piv);
        showHint('Drag on the floor · ↻ Rotate · tap floor to deselect');
        markDirty();
        return;
    }

    // World-space bounding box of this furniture group
    let mn = new BABYLON.Vector3( 1e9, 1e9, 1e9);
    let mx = new BABYLON.Vector3(-1e9,-1e9,-1e9);
    matches.forEach(m => {
        m.computeWorldMatrix(true);
        const bb = m.getBoundingInfo().boundingBox;
        mn = BABYLON.Vector3.Minimize(mn, bb.minimumWorld);
        mx = BABYLON.Vector3.Maximize(mx, bb.maximumWorld);
    });
    const cx = (mn.x + mx.x) / 2;
    const cy = mn.y;               // base sits on Y=0
    const cz = (mn.z + mx.z) / 2;

    // Create pivot at world origin
    const furPivot = new BABYLON.TransformNode('furpiv_' + Date.now(), scene);
    furPivot.metadata = { isFurPivot: true };

    matches.forEach(m => {
        const cl = m.clone(m.name + '_cl' + Date.now(), null);
        if (!cl) return;
        const wp = m.getAbsolutePosition();
        cl.position.set(wp.x - cx, wp.y - cy, wp.z - cz);
        if (m.rotationQuaternion) {
            cl.rotationQuaternion = m.rotationQuaternion.clone();
        } else {
            cl.rotation.copyFrom(m.rotation);
        }
        cl.isVisible  = true;
        cl.isPickable = true;
        cl.parent     = furPivot;
        cl.metadata   = { ...(cl.metadata || {}), furPivot: furPivot };
        cl.receiveShadows = true;
        try { shadows.addShadowCaster(cl, true); } catch(e) {}
    });

    // Tag any grandchild meshes too (for deep GLB hierarchies)
    furPivot.getChildMeshes(false).forEach(cm => {
        cm.metadata   = { ...(cm.metadata || {}), furPivot: furPivot };
        cm.isPickable = true;
    });

    furPivot.position.set(0, floorY, 0);
    // Y-correction: snap base exactly to floor level (bidirectional — fixes both
    // floating furniture and furniture buried under the floor)
    furPivot.computeWorldMatrix(true);
    furPivot.getChildMeshes(false).forEach(cm => cm.computeWorldMatrix(true));
    let _minYa = Infinity;
    furPivot.getChildMeshes(false).forEach(cm => {
        try { const b = cm.getBoundingInfo().boundingBox.minimumWorld.y; if (b < _minYa) _minYa = b; } catch(_) {}
    });
    if (_minYa !== Infinity && Math.abs(_minYa - floorY) > 0.05)
        furPivot.position.y += (floorY - _minYa);
    furnitureList.push(furPivot);
    selectFurniture(furPivot);
    showHint('Drag on the floor · ↻ Rotate · tap floor to deselect');
    markDirty();
}


// ── Selection / drag ────────────────────────────────────────────────────────
function selectFurniture(pv) {
    deselectFurniture();
    selectedFurPivot = pv;
    if (!pv) return;

    if (hlLayer) {
        pv.getChildMeshes().forEach(m => {
            try { hlLayer.addMesh(m, new BABYLON.Color3(0.15, 0.90, 0.25)); } catch(e) {}
        });
    }
    // Selection ring under piece
    selRing = BABYLON.MeshBuilder.CreateTorus('selRing',
        {diameter:1.0, thickness:0.045, tessellation:32}, scene);
    const rm = new BABYLON.PBRMaterial('selRingMat', scene);
    rm.emissiveColor = new BABYLON.Color3(0.05, 0.85, 0.18);
    rm.metallic = 0.4; rm.roughness = 0.4;
    selRing.material = rm; selRing.parent = pv;
    selRing.position.set(0, 0.01, 0); selRing.isPickable = false;

    document.getElementById('btn-rotate-furn').style.opacity  = '1';
    document.getElementById('btn-smaller-furn').style.opacity = '1';
    document.getElementById('btn-bigger-furn').style.opacity  = '1';
    document.getElementById('btn-delete-furn').style.opacity  = '1';
}

function deselectFurniture() {
    if (hlLayer) hlLayer.removeAllMeshes();
    if (selRing && !selRing.isDisposed()) { selRing.parent = null; selRing.dispose(); }
    selRing = null; selectedFurPivot = null;
    document.getElementById('btn-rotate-furn').style.opacity  = '0.5';
    document.getElementById('btn-smaller-furn').style.opacity = '0.5';
    document.getElementById('btn-bigger-furn').style.opacity  = '0.5';
    document.getElementById('btn-delete-furn').style.opacity  = '0.5';
}

function rotateFurniture() {
    if (selectedFurPivot) selectedFurPivot.rotation.y += Math.PI / 4;
}

function scaleFurniture(factor) {
    if (!selectedFurPivot) return;
    const cur  = selectedFurPivot.scaling.x;
    const next = Math.min(5, Math.max(0.1, cur * factor));
    selectedFurPivot.scaling.setAll(next);
    // re-snap bottom to floor after scale
    selectedFurPivot.computeWorldMatrix(true);
    selectedFurPivot.getChildMeshes(false).forEach(cm => cm.computeWorldMatrix(true));
    let _minYc = 0;
    selectedFurPivot.getChildMeshes(false).forEach(cm => {
        try { const b = cm.getBoundingInfo().boundingBox.minimumWorld.y; if (b < _minYc) _minYc = b; } catch(_) {}
    });
    if (Math.abs(_minYc) > 0.01) selectedFurPivot.position.y -= _minYc;
}

function deleteFurniture() {
    const pv = selectedFurPivot;
    if (!pv) return;
    deselectFurniture();
    const idx = furnitureList.indexOf(pv);
    if (idx !== -1) furnitureList.splice(idx, 1);
    pv.dispose();
}

// ── Drag system (Babylon.js pointer observables) ─────────────────────────────
// Tap detection — track pointer-down position/time; only show zone popup if
// the pointer didn't move more than 14px and was held for <450ms (not a drag).
let _tapDownX = 0, _tapDownY = 0, _tapDownTime = 0;

scene.onPointerObservable.add(pi => {
    // ── Floor plan: tap-to-place zone ──
    if (isFloorPlan && isPlacingZone &&
        pi.type === BABYLON.PointerEventTypes.POINTERDOWN) {
        const hit = scene.pick(scene.pointerX, scene.pointerY,
            m => m.name === 'zonePickFloor');
        if (hit.hit && hit.pickedPoint)
            placeZoneAt(hit.pickedPoint.x, hit.pickedPoint.z);
        return;
    }

    // ── Floor plan: record pointer-down position for tap detection ──
    if (isFloorPlan && !isPlacingZone &&
        pi.type === BABYLON.PointerEventTypes.POINTERDOWN) {
        _tapDownX = scene.pointerX;
        _tapDownY = scene.pointerY;
        _tapDownTime = Date.now();
    }

    // ── Floor plan: confirm tap on POINTERUP — short press with no drag ──
    if (isFloorPlan && !isPlacingZone &&
        pi.type === BABYLON.PointerEventTypes.POINTERUP) {
        const dx = scene.pointerX - _tapDownX;
        const dy = scene.pointerY - _tapDownY;
        if (Math.sqrt(dx*dx + dy*dy) < 14 && Date.now() - _tapDownTime < 450) {
            // Pick at DOWN coordinates — more reliable finger-press position
            const zh = scene.pick(_tapDownX, _tapDownY,
                m => !!(m.metadata && m.metadata.isZoneTile));
            if (zh.hit) { showZonePopup(zh.pickedMesh); return; }
        }
    }

    if (!isInterior) return;

    if (pi.type === BABYLON.PointerEventTypes.POINTERDOWN) {
        // 1. Furniture hit — select and start drag
        const hit = scene.pick(scene.pointerX, scene.pointerY,
            m => !!(m.metadata && m.metadata.furPivot));
        if (hit.hit && hit.pickedMesh?.metadata?.furPivot) {
            hideZonePopup();
            selectFurniture(hit.pickedMesh.metadata.furPivot);
            isDraggingFur = true;
            camera.detachControl();
            return;
        }
        // 2. Floor tap → close popup + deselect furniture
        const floorHit = scene.pick(scene.pointerX, scene.pointerY,
            m => m.name === 'interiorFloor');
        if (floorHit.hit && !isDraggingFur) { hideZonePopup(); deselectFurniture(); }
    }

    if (pi.type === BABYLON.PointerEventTypes.POINTERMOVE &&
        isDraggingFur && selectedFurPivot) {
        const hit = scene.pick(scene.pointerX, scene.pointerY,
            m => m.name === 'interiorFloor');
        if (hit.hit && hit.pickedPoint) {
            selectedFurPivot.position.x = hit.pickedPoint.x;
            selectedFurPivot.position.z = hit.pickedPoint.z;
        }
    }

    if (pi.type === BABYLON.PointerEventTypes.POINTERUP && isDraggingFur) {
        isDraggingFur = false;
        camera.attachControl(canvas, true);
    }
});

// Render-on-demand: only draw when something changed (normal/static view)
// or when a continuous mode is active (360 exploration, floor-plan, interior,
// furniture drag). This is the single biggest win for large GLB files.
engine.runRenderLoop(() => {
    if (_dirty || isIn360 || isFloorPlan || isInterior || isDraggingFur || isPlacingZone) {
        scene.render();
        _dirty = false;
    }
});
window.addEventListener('resize', () => { engine.resize(); markDirty(); });
</script>
